[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-asset-auditor"
version = "0.1.0"
description = "Read-only CLI auditor for ComfyUI workflow, custom-node pack, and model usage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OpenAI Codex"}]
dependencies = []

[project.scripts]
comfy-audit = "comfy_audit.cli:main"

[tool.setuptools.packages.find]
include = ["comfy_audit*"]

